<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="purg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a13"/>
      <stop offset="50%" stop-color="#12281e"/>
      <stop offset="100%" stop-color="#08140e"/>
    </linearGradient>
    <linearGradient id="purg-river" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <pattern id="purg-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.7" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#purg-bg)"/>
  <rect width="800" height="500" fill="url(#purg-grid)"/>

  <!-- North Island -->
  <path d="M 140 80 C 300 60, 520 70, 680 90 C 720 180, 650 210, 480 200 C 320 190, 150 210, 110 160 C 90 120, 110 90, 140 80 Z" 
        fill="#14532d" stroke="#34d399" stroke-width="2" stroke-opacity="0.7"/>

  <!-- South Island -->
  <path d="M 120 280 C 260 270, 540 265, 690 285 C 720 380, 620 440, 420 435 C 220 430, 90 390, 100 320 Z" 
        fill="#15803d" stroke="#34d399" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Central Bifurcated River -->
  <path d="M 50 230 C 200 235, 340 210, 480 240 C 620 270, 750 230, 800 235 L 800 270 C 730 290, 610 260, 470 240 C 330 220, 190 250, 50 255 Z" 
        fill="url(#purg-river)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- 4 Tactical Suspension Bridges -->
  <rect x="220" y="215" width="22" height="45" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  <line x1="220" y1="237" x2="242" y2="237" stroke="#fbbf24" stroke-width="1.5"/>

  <rect x="360" y="210" width="22" height="42" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  <line x1="360" y1="231" x2="382" y2="231" stroke="#fbbf24" stroke-width="1.5"/>

  <rect x="520" y="225" width="22" height="45" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  <line x1="520" y1="247" x2="542" y2="247" stroke="#fbbf24" stroke-width="1.5"/>

  <rect x="650" y="240" width="22" height="40" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="2"/>

  <!-- Moathouse in the River Lake -->
  <circle cx="480" cy="240" r="22" fill="#0f172a" stroke="#a855f7" stroke-width="2.5"/>
  <circle cx="480" cy="240" r="8" fill="#c084fc"/>
  <text x="480" y="278" fill="#e9d5ff" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">MOATHOUSE</text>

  <!-- Ski Lodge (High Peak North) -->
  <g transform="translate(560, 130)">
    <polygon points="0,-14 12,10 -12,10" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="26" fill="#7dd3fc" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">SKI LODGE</text>
  </g>

  <!-- Central (Hot Drop) -->
  <g transform="translate(300, 340)">
    <circle cx="0" cy="0" r="15" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.5"/>
    <text x="0" y="25" fill="#fca5a5" font-family="'Chakra Petch', sans-serif" font-size="12" font-weight="800" text-anchor="middle">★ CENTRAL</text>
  </g>

  <!-- Marble Pop -->
  <g transform="translate(240, 140)">
    <circle cx="0" cy="0" r="10" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="0" y="22" fill="#cbd5e1" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">MARBLE POP</text>
  </g>

  <!-- Tactical HUD -->
  <rect x="20" y="20" width="145" height="34" rx="4" fill="#030712" fill-opacity="0.8" stroke="#10b981" stroke-width="1"/>
  <text x="30" y="42" fill="#34d399" font-family="'Chakra Petch', monospace" font-size="13" font-weight="700">MAP 02 // PURGATORY</text>
  <text x="770" y="45" fill="#10b981" font-family="'Chakra Petch', monospace" font-size="11" text-anchor="end" opacity="0.8">RIVER CHOKEPOINTS: ACTIVE</text>
  <text x="770" y="65" fill="#94a3b8" font-family="'Chakra Petch', monospace" font-size="10" text-anchor="end">TERRAIN: RURAL HIGHLANDS</text>
</svg>

