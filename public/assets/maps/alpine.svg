<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="alp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081e28"/>
      <stop offset="50%" stop-color="#0c2b3b"/>
      <stop offset="100%" stop-color="#041219"/>
    </linearGradient>
    <linearGradient id="alp-snow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="alp-glow" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="alp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#alp-bg)"/>
  <rect width="800" height="500" fill="url(#alp-glow)"/>
  <rect width="800" height="500" fill="url(#alp-grid)"/>

  <!-- Mountain Valley Peaks with Snow -->
  <polygon points="120,380 280,120 440,380" fill="#0369a1" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <polygon points="230,195 280,120 330,195" fill="url(#alp-snow)"/>

  <polygon points="340,420 520,150 700,420" fill="#075985" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <polygon points="460,240 520,150 580,240" fill="url(#alp-snow)"/>

  <!-- Valley Floor -->
  <path d="M 50 360 Q 240 310 420 340 T 750 320 L 780 470 L 20 470 Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Alpine Railway Track -->
  <path d="M 60 410 C 220 370, 420 420, 740 360" fill="none" stroke="#64748b" stroke-width="6"/>
  <path d="M 60 410 C 220 370, 420 420, 740 360" fill="none" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- Snowfall (Hotspot Town) -->
  <g transform="translate(420, 310)">
    <circle cx="0" cy="0" r="18" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#f87171"/>
    <text x="0" y="-24" fill="#fecaca" font-family="'Chakra Petch', sans-serif" font-size="13" font-weight="800" text-anchor="middle">★ SNOWFALL</text>
  </g>

  <!-- Military Zinc -->
  <g transform="translate(620, 310)">
    <rect x="-14" y="-14" width="28" height="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="28" fill="#bae6fd" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">MILITARY ZINC</text>
  </g>

  <!-- Blue Ville -->
  <g transform="translate(200, 340)">
    <circle cx="0" cy="0" r="12" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="24" fill="#e0f2fe" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">BLUE VILLE</text>
  </g>

  <!-- Fusion -->
  <g transform="translate(360, 210)">
    <polygon points="0,-12 12,8 -12,8" fill="#4338ca" stroke="#818cf8" stroke-width="2"/>
    <text x="0" y="24" fill="#c7d2fe" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">FUSION</text>
  </g>

  <!-- Tactical HUD -->
  <rect x="20" y="20" width="130" height="34" rx="4" fill="#030712" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1"/>
  <text x="30" y="42" fill="#38bdf8" font-family="'Chakra Petch', monospace" font-size="13" font-weight="700">MAP 04 // ALPINE</text>
  <text x="770" y="45" fill="#38bdf8" font-family="'Chakra Petch', monospace" font-size="11" text-anchor="end" opacity="0.8">WEATHER: BLIZZARD SUB-ZERO</text>
  <text x="770" y="65" fill="#94a3b8" font-family="'Chakra Petch', monospace" font-size="10" text-anchor="end">TERRAIN: SNOW-CAPPED VALLEY</text>
</svg>

