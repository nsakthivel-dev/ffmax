<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sol-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f07"/>
      <stop offset="40%" stop-color="#261705"/>
      <stop offset="100%" stop-color="#0a121d"/>
    </linearGradient>
    <linearGradient id="sol-sea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="sol-glow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sol-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f59e0b" stroke-width="0.7" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#sol-bg)"/>
  <rect width="800" height="500" fill="url(#sol-glow)"/>
  <rect width="800" height="500" fill="url(#sol-grid)"/>

  <!-- Coastal Port Outline -->
  <path d="M 100 420 C 180 320, 260 280, 380 290 C 500 300, 620 220, 720 180 L 800 500 L 0 500 Z" 
        fill="url(#sol-sea)" stroke="#0284c7" stroke-width="2"/>

  <!-- High-Tech Port City Island -->
  <path d="M 120 160 C 260 90, 520 80, 680 140 C 730 260, 640 360, 480 370 C 320 380, 160 360, 100 280 Z" 
        fill="#1e1b4b" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Full-Map Slide Track (Rail Network) -->
  <path d="M 140 220 Q 380 120 640 180 T 520 340 Q 300 360 140 220 Z" 
        fill="none" stroke="#38bdf8" stroke-width="5" stroke-dasharray="14,6"/>
  <path d="M 140 220 Q 380 120 640 180 T 520 340 Q 300 360 140 220 Z" 
        fill="none" stroke="#facc15" stroke-width="1.8"/>

  <!-- TV Tower (Iconic High Ground Spire) -->
  <g transform="translate(420, 180)">
    <line x1="0" y1="20" x2="0" y2="-60" stroke="#f43f5e" stroke-width="4"/>
    <circle cx="0" cy="-60" r="9" fill="#ef4444" stroke="#fecaca" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="7" fill="#facc15"/>
    <text x="0" y="38" fill="#fecaca" font-family="'Chakra Petch', sans-serif" font-size="13" font-weight="800" text-anchor="middle">★ TV TOWER</text>
  </g>

  <!-- Bloomtown -->
  <g transform="translate(230, 240)">
    <circle cx="0" cy="0" r="14" fill="#312e81" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="26" fill="#e9d5ff" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">BLOOMTOWN</text>
  </g>

  <!-- Quantum City -->
  <g transform="translate(580, 210)">
    <rect x="-14" y="-14" width="28" height="28" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="28" fill="#bae6fd" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">QUANTUM CITY</text>
  </g>

  <!-- The Hub -->
  <g transform="translate(340, 310)">
    <polygon points="0,-12 12,8 -12,8" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <text x="0" y="24" fill="#fef08a" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">THE HUB</text>
  </g>

  <!-- Tactical HUD -->
  <rect x="20" y="20" width="135" height="34" rx="4" fill="#030712" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1"/>
  <text x="30" y="42" fill="#fbbf24" font-family="'Chakra Petch', monospace" font-size="13" font-weight="700">MAP 06 // SOLARA</text>
  <text x="770" y="45" fill="#f59e0b" font-family="'Chakra Petch', monospace" font-size="11" text-anchor="end" opacity="0.8">SLIDE TRACK SYSTEM: ONLINE</text>
  <text x="770" y="65" fill="#94a3b8" font-family="'Chakra Petch', monospace" font-size="10" text-anchor="end">TERRAIN: FUTURISTIC PORT CITY</text>
</svg>

