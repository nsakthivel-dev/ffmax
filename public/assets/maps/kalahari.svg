<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241407"/>
      <stop offset="50%" stop-color="#3b1d07"/>
      <stop offset="100%" stop-color="#190d05"/>
    </linearGradient>
    <linearGradient id="kal-sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="kal-sun" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="kal-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f59e0b" stroke-width="0.7" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#kal-bg)"/>
  <rect width="800" height="500" fill="url(#kal-sun)"/>
  <rect width="800" height="500" fill="url(#kal-grid)"/>

  <!-- Desert Ridge Dunes & Canyon Formations -->
  <path d="M 80 140 Q 250 80 440 130 T 730 110 L 760 410 Q 560 460 380 420 T 60 380 Z" 
        fill="url(#kal-sand)" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Deep Dry Riverbed Canyon -->
  <path d="M 120 400 Q 280 280 430 320 T 710 160" 
        fill="none" stroke="#451a03" stroke-width="28" stroke-linecap="round" opacity="0.8"/>
  <path d="M 120 400 Q 280 280 430 320 T 710 160" 
        fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round" stroke-dasharray="10,6"/>

  <!-- Santa Catarina (Stranded Submarine on Mountain) -->
  <g transform="translate(560, 260) rotate(-18)">
    <path d="M -45 -12 L 35 -12 Q 55 0 35 12 L -45 12 Q -55 0 -45 -12 Z" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <rect x="-10" y="-22" width="18" height="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <text x="0" y="30" fill="#fecaca" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">SANTA CATARINA</text>
  </g>

  <!-- Refinery (Elevated Scaffolding Hotspot) -->
  <g transform="translate(380, 210)">
    <circle cx="0" cy="0" r="22" fill="#78350f" stroke="#fbbf24" stroke-width="3"/>
    <rect x="-12" y="-12" width="24" height="24" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#fde047"/>
    <text x="0" y="-30" fill="#fde047" font-family="'Chakra Petch', sans-serif" font-size="13" font-weight="800" text-anchor="middle">★ REFINERY</text>
  </g>

  <!-- Command Post -->
  <g transform="translate(230, 220)">
    <polygon points="0,-14 14,10 -14,10" fill="#1c1917" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="26" fill="#bae6fd" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">COMMAND POST</text>
  </g>

  <!-- The Maze / Ruins -->
  <g transform="translate(300, 350)">
    <rect x="-14" y="-14" width="28" height="28" fill="#292524" stroke="#a8a29e" stroke-width="1.5"/>
    <text x="0" y="28" fill="#d6d3d1" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">RUINS</text>
  </g>

  <!-- Council Hall -->
  <g transform="translate(620, 140)">
    <circle cx="0" cy="0" r="12" fill="#292524" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="0" y="24" fill="#fef08a" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">COUNCIL HALL</text>
  </g>

  <!-- Tactical HUD -->
  <rect x="20" y="20" width="145" height="34" rx="4" fill="#030712" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1"/>
  <text x="30" y="42" fill="#fbbf24" font-family="'Chakra Petch', monospace" font-size="13" font-weight="700">MAP 03 // KALAHARI</text>
  <text x="770" y="45" fill="#f59e0b" font-family="'Chakra Petch', monospace" font-size="11" text-anchor="end" opacity="0.8">VERTICAL ELEVATION: HIGH</text>
  <text x="770" y="65" fill="#94a3b8" font-family="'Chakra Petch', monospace" font-size="10" text-anchor="end">TERRAIN: ARID DESERT & CANYON</text>
</svg>

