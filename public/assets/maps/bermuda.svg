<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bermuda-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041b1d"/>
      <stop offset="40%" stop-color="#082b27"/>
      <stop offset="100%" stop-color="#091316"/>
    </linearGradient>
    <linearGradient id="bermuda-water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="bermuda-land" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="70%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="bermuda-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="radar-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22c55e" stroke-width="0.7" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bermuda-bg)"/>
  <rect width="800" height="500" fill="url(#bermuda-water)"/>
  <rect width="800" height="500" fill="url(#radar-grid)"/>

  <!-- Island Terrain Contour -->
  <path d="M 120 220 C 140 140, 260 90, 420 100 C 580 110, 680 180, 690 300 C 700 420, 560 440, 400 430 C 240 420, 100 320, 120 220 Z" 
        fill="url(#bermuda-land)" stroke="#4ade80" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Inner Elevation Ridges -->
  <path d="M 240 220 C 280 160, 420 140, 520 170 C 600 200, 590 320, 510 360 C 420 400, 300 370, 260 300 Z" 
        fill="#166534" stroke="#86efac" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Peak Center Zone -->
  <ellipse cx="410" cy="245" rx="75" ry="45" fill="#14532d" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="410" cy="245" r="45" fill="url(#bermuda-glow)"/>

  <!-- Radar Rings -->
  <circle cx="410" cy="245" r="120" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <circle cx="410" cy="245" r="190" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Iconic Free Fire Bermuda Locations -->
  <!-- Clock Tower -->
  <g transform="translate(240, 260)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="0,-8 7,5 -7,5" fill="#f59e0b"/>
    <text x="0" y="24" fill="#fef08a" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CLOCK TOWER</text>
  </g>

  <!-- Peak -->
  <g transform="translate(410, 245)">
    <circle cx="0" cy="0" r="18" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#f87171"/>
    <text x="0" y="-24" fill="#fca5a5" font-family="'Chakra Petch', sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.5">★ PEAK (HOT ZONE)</text>
  </g>

  <!-- Bimasakti Strip -->
  <g transform="translate(470, 320)">
    <rect x="-35" y="-6" width="70" height="12" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#facc15" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="0" y="22" fill="#bae6fd" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">BIMASAKTI</text>
  </g>

  <!-- Pochinok -->
  <g transform="translate(320, 340)">
    <circle cx="0" cy="0" r="8" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="0" y="20" fill="#cbd5e1" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">POCHINOK</text>
  </g>

  <!-- Factory -->
  <g transform="translate(540, 210)">
    <rect x="-10" y="-10" width="20" height="20" fill="#312e81" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="24" fill="#e9d5ff" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" text-anchor="middle">FACTORY</text>
  </g>

  <!-- Tactical HUD Overlay -->
  <rect x="20" y="20" width="130" height="34" rx="4" fill="#030712" fill-opacity="0.8" stroke="#22c55e" stroke-width="1"/>
  <text x="30" y="42" fill="#4ade80" font-family="'Chakra Petch', monospace" font-size="13" font-weight="700">MAP 01 // BERMUDA</text>
  
  <text x="770" y="45" fill="#22c55e" font-family="'Chakra Petch', monospace" font-size="11" text-anchor="end" opacity="0.8">COORDS: 42°18'N 71°04'W</text>
  <text x="770" y="65" fill="#94a3b8" font-family="'Chakra Petch', monospace" font-size="10" text-anchor="end">TERRAIN: TROPICAL COASTAL</text>

  <!-- Crosshairs -->
  <line x1="410" y1="30" x2="410" y2="470" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.15"/>
  <line x1="30" y1="245" x2="770" y2="245" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.15"/>
</svg>

